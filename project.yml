name: Folio
options:
  bundleIdPrefix: com.sevgjan
  deploymentTarget:
    macOS: "14.0"
packages:
  SwiftMarkdown:
    url: https://github.com/swiftlang/swift-markdown.git
    branch: main
  HighlightSwift:
    url: https://github.com/appstefan/HighlightSwift.git
    from: 1.1.0
  LaTeXSwiftUI:
    url: https://github.com/colinc86/LaTeXSwiftUI.git
    from: 2.0.0
targets:
  Folio:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Folio
        type: syncedFolder
      - path: Shared
        type: syncedFolder
    info:
      path: Folio/Info.plist
      properties:
        CFBundleDisplayName: Folio
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: ""
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - net.daringfireball.markdown
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown Document
            UTTypeConformsTo:
              - public.plain-text
            UTTypeTagSpecification:
              public.filename-extension:
                - md
                - markdown
    entitlements:
      path: Folio/Folio.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.sevgjan.folio
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: SwiftMarkdown
        product: Markdown
      - package: HighlightSwift
        product: HighlightSwift
      - package: LaTeXSwiftUI
        product: LaTeXSwiftUI
      - target: FolioQuickLook
        embed: true

  FolioQuickLook:
    type: app-extension
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: FolioQuickLook
        type: syncedFolder
      - path: Shared
        type: syncedFolder
    info:
      path: FolioQuickLook/Info.plist
      properties:
        CFBundleDisplayName: Folio Quick Look
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewProvider
          NSExtensionAttributes:
            QLSupportedContentTypes:
              - net.daringfireball.markdown
    entitlements:
      path: FolioQuickLook/FolioQuickLook.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
    settings:
      base:
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.sevgjan.folio.QuickLook
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        SKIP_INSTALL: YES
    dependencies:
      - package: SwiftMarkdown
        product: Markdown
      - package: HighlightSwift
        product: HighlightSwift
